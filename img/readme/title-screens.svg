<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="So sieht es aus">
  <title>So sieht es aus</title>
  <defs>
    <clipPath id="reveal"><rect x="600" y="0" width="0" height="120">
      <animate attributeName="x" from="600" to="0" dur="1.1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <animate attributeName="width" from="0" to="1200" dur="1.1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
    </rect></clipPath>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#ede9e4"/><stop offset="0.46" stop-color="#ede9e4"/>
      <stop offset="0.5" stop-color="#f4b2a3"/><stop offset="0.54" stop-color="#ede9e4"/><stop offset="1" stop-color="#ede9e4"/>
      <animate attributeName="x1" values="-1;1.5" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2.5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .kick { opacity: 0; animation: fade 0.8s ease-out 0.05s forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .under { stroke-dasharray: 160; stroke-dashoffset: 160; animation: draw 0.9s cubic-bezier(0.16,1,0.3,1) 0.6s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .runner { opacity: 0; animation: run 3.2s cubic-bezier(0.65,0,0.35,1) 1.4s infinite alternate, on 0.3s 1.4s forwards; }
    @keyframes run { from { transform: translateX(0); } to { transform: translateX(160px); } }
    @keyframes on { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .kick, .runner { opacity: 1; } .under { stroke-dashoffset: 0; } }
  </style>
  <text class="kick" x="600" y="24" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="5" fill="#eb8975">06</text>
  <g clip-path="url(#reveal)">
    <text x="600" y="78" text-anchor="middle" font-size="42" font-weight="700" letter-spacing="-1" fill="url(#shine)">So sieht es aus</text>
  </g>
  <line class="under" x1="520" y1="102" x2="680" y2="102" stroke="#eb8975" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <circle class="runner" cx="520" cy="102" r="4" fill="#eb8975"/>
</svg>
