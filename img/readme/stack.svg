<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="Technik: HTML, CSS, JavaScript, Service Worker, Electron, Capacitor, Supabase, Swift, WidgetKit, GitHub Actions">
