<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Sync-Ablauf: Aenderungen gehen ueber Supabase an alle Geraete; offline merkt sich die App offene Aenderungen und laedt sie spaeter hoch">
  <title>Sync-Ablauf</title>
  <!-- Ein Durchlauf dauert 12 s: 0-4 online, 4-8 offline (Warteschlange), 8-10 Nachholen, 10-12 Ruhe -->
  <style>
    text { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .on   { animation: on 12s steps(1) infinite; }
    .off  { animation: off 12s steps(1) infinite; }
    @keyframes on  { 0% { opacity: 1; } 33.33% { opacity: 0; } 66.66% { opacity: 1; } }
    @keyframes off { 0% { opacity: 0; } 33.33% { opacity: 1; } 66.66% { opacity: 0; } }
    .q { opacity: 0; animation: q 12s infinite; transform-box: fill-box; transform-origin: center; }
    .q1 { --t: 0; }
    @keyframes q1 { 0%,37% { opacity: 0; transform: scale(0); } 39%,66% { opacity: 1; transform: scale(1); } 68%,100% { opacity: 0; transform: scale(0); } }
    @keyframes q2 { 0%,45% { opacity: 0; transform: scale(0); } 47%,66% { opacity: 1; transform: scale(1); } 68%,100% { opacity: 0; transform: scale(0); } }
    @keyframes q3 { 0%,53% { opacity: 0; transform: scale(0); } 55%,66% { opacity: 1; transform: scale(1); } 68%,100% { opacity: 0; transform: scale(0); } }
    .cloud { transform-box: fill-box; transform-origin: center; animation: bump 12s infinite; }
    @keyframes bump { 0%,14% { transform: none; } 16% { transform: scale(1.06); } 19%,74% { transform: none; } 76% { transform: scale(1.08); } 80%,100% { transform: none; } }
    .glow { animation: glow 12s infinite; }
    @keyframes glow { 0%,14% { opacity: 0; } 16% { opacity: 0.8; } 22%,74% { opacity: 0; } 76% { opacity: 0.9; } 84%,100% { opacity: 0; } }
    .wave { animation: wave 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    @keyframes wave { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }
    .w2 { animation-delay: 0.2s; } .w3 { animation-delay: 0.4s; }
    .dash { stroke-dasharray: 5 7; animation: dash 1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .off, .q { opacity: 0; } }
  </style>
  <rect width="1200" height="380" rx="20" fill="#1c1814"/>

  <!-- Leitungen -->
  <g fill="none" stroke="#ede9e4" stroke-opacity="0.14" stroke-width="2">
    <path class="dash" d="M250 240 Q400 120 560 128"/>
    <path class="dash" d="M640 128 Q800 120 950 240"/>
  </g>
  <!-- Leitung Handy rot gestrichelt, solange offline -->
  <path class="off" d="M250 240 Q400 120 560 128" fill="none" stroke="#e8c37a" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="2 10"/>

  <!-- Cloud / Supabase -->
  <circle class="glow" cx="600" cy="120" r="90" fill="#eb8975" fill-opacity="0.18"/>
  <g class="cloud">
    <path d="M548 150 C522 150 512 126 528 112 C526 90 552 78 568 92 C576 70 616 66 628 92 C650 86 668 104 660 124 C676 130 672 150 652 150 Z" fill="#241f1a" stroke="#eb8975" stroke-width="2.5"/>
    <g fill="none" stroke="#eb8975" stroke-width="2">
      <ellipse cx="596" cy="114" rx="18" ry="6"/>
      <path d="M578 114 V132 A18 6 0 0 0 614 132 V114"/>
      <path d="M578 123 A18 6 0 0 0 614 123"/>
    </g>
  </g>
  <text x="600" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#ede9e4">Supabase</text>
  <text x="600" y="205" text-anchor="middle" font-size="12" fill="#a9a29b">user_data · Row-Level-Security</text>

  <!-- Handy -->
  <rect x="190" y="196" width="80" height="140" rx="16" fill="#241f1a" stroke="#ede9e4" stroke-opacity="0.25" stroke-width="2"/>
  <rect x="212" y="204" width="36" height="9" rx="4.5" fill="#000"/>
  <circle cx="230" cy="262" r="20" fill="none" stroke="#2e2722" stroke-width="5"/>
  <circle cx="230" cy="262" r="20" fill="none" stroke="#eb8975" stroke-width="5" stroke-dasharray="126" stroke-dashoffset="40" transform="rotate(-90 230 262)"/>
  <!-- WLAN-Symbol am Handy -->
  <g transform="translate(286 196)">
    <g class="on" fill="none" stroke="#86a861" stroke-width="3" stroke-linecap="round">
      <path class="wave w3" d="M2 10 Q14 0 26 10"/><path class="wave w2" d="M6 15 Q14 8 22 15"/><circle class="wave" cx="14" cy="20" r="2" fill="#86a861"/>
    </g>
    <g class="off" fill="none" stroke="#e8c37a" stroke-width="3" stroke-linecap="round">
      <path d="M2 10 Q14 0 26 10" stroke-opacity="0.35"/><path d="M6 15 Q14 8 22 15" stroke-opacity="0.35"/><line x1="3" y1="2" x2="25" y2="22"/>
    </g>
  </g>
  <!-- Warteschlange pomo__dirty -->
  <g>
    <rect class="q" x="190" y="346" width="20" height="10" rx="3" fill="#e8c37a" style="animation-name:q1"/>
    <rect class="q" x="216" y="346" width="20" height="10" rx="3" fill="#e8c37a" style="animation-name:q2"/>
    <rect class="q" x="242" y="346" width="20" height="10" rx="3" fill="#e8c37a" style="animation-name:q3"/>
  </g>
  <text x="300" y="320" font-size="14" font-weight="600" fill="#ede9e4">Handy</text>

  <!-- Laptop -->
  <rect x="890" y="222" width="130" height="86" rx="8" fill="#241f1a" stroke="#ede9e4" stroke-opacity="0.25" stroke-width="2"/>
  <rect x="872" y="312" width="166" height="10" rx="4" fill="#ede9e4" fill-opacity="0.12"/>
  <text class="cloud" x="955" y="276" text-anchor="middle" font-size="26" font-weight="700" fill="#ede9e4">75</text>
  <text x="955" y="296" text-anchor="middle" font-size="11" fill="#a9a29b">min heute</text>
  <text x="1050" y="250" font-size="14" font-weight="600" fill="#ede9e4">Laptop</text>

  <!-- Pakete -->
  <circle r="7" fill="#eb8975">
    <animateMotion dur="12s" repeatCount="indefinite" path="M250 240 Q400 120 560 128 L640 128 Q800 120 950 240" keyPoints="0;0;1;1" keyTimes="0;0.02;0.3;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.03;0.28;0.31;1"/>
  </circle>
  <circle r="7" fill="#e8c37a">
    <animateMotion dur="12s" repeatCount="indefinite" path="M250 240 Q400 120 560 128 L640 128 Q800 120 950 240" keyPoints="0;0;1;1" keyTimes="0;0.67;0.86;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.66;0.68;0.84;0.87;1"/>
  </circle>
  <circle r="5" fill="#e8c37a">
    <animateMotion dur="12s" repeatCount="indefinite" path="M250 240 Q400 120 560 128 L640 128 Q800 120 950 240" keyPoints="0;0;1;1" keyTimes="0;0.69;0.88;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.68;0.70;0.86;0.89;1"/>
  </circle>

  <!-- Status -->
  <g class="on">
    <rect x="460" y="290" width="280" height="40" rx="20" fill="#86a861" fill-opacity="0.12" stroke="#86a861" stroke-opacity="0.5"/>
    <circle cx="486" cy="310" r="6" fill="#86a861"><animate attributeName="r" values="5;8;5" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="502" y="315" font-size="15" font-weight="600" fill="#ede9e4">online · nach ~1 s abgeglichen</text>
  </g>
  <g class="off">
    <rect x="440" y="290" width="320" height="40" rx="20" fill="#e8c37a" fill-opacity="0.12" stroke="#e8c37a" stroke-opacity="0.5"/>
    <circle cx="466" cy="310" r="6" fill="#e8c37a"/>
    <text x="482" y="315" font-size="15" font-weight="600" fill="#ede9e4">offline · pomo__dirty merkt sich alles</text>
  </g>
  <text x="600" y="40" text-anchor="middle" font-size="15" font-weight="600" fill="#eb8975" letter-spacing="3">LIVE-SYNC</text>
</svg>
