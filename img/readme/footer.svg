<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="Eine Sache nach der anderen.">
  <title>Eine Sache nach der anderen.</title>
  <defs><clipPath id="c"><rect width="1200" height="160" rx="20"/></clipPath></defs>
  <style>
    .w1 { animation: wave 9s linear infinite; }
    .w2 { animation: wave 13s linear infinite reverse; }
    .w3 { animation: wave 17s linear infinite; }
    @keyframes wave { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    .txt { animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="160" fill="#1c1814"/>
    <path class="w3" d="M0 110 Q150 80 300 110 T600 110 T900 110 T1200 110 T1500 110 T1800 110 V160 H0 Z" fill="#e8c37a" fill-opacity="0.08"/>
    <path class="w2" d="M0 120 Q150 95 300 120 T600 120 T900 120 T1200 120 T1500 120 T1800 120 V160 H0 Z" fill="#86a861" fill-opacity="0.12"/>
    <path class="w1" d="M0 132 Q150 112 300 132 T600 132 T900 132 T1200 132 T1500 132 T1800 132 V160 H0 Z" fill="#eb8975" fill-opacity="0.3"/>
  </g>
  <text class="txt" x="600" y="70" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#ede9e4">Eine Sache nach der anderen.</text>
</svg>
