<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Design-Wechsel zwischen Coral und Original">
  <title>Zwei Designs: Coral und Original</title>
  <!-- 10 s: 0-45 % Coral, 50-95 % Original -->
  <style>
    text { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .bg     { animation: bg 10s ease-in-out infinite; }
    .card   { animation: card 10s ease-in-out infinite; }
    .acc-f  { animation: accF 10s ease-in-out infinite; }
    .acc-s  { animation: accS 10s ease-in-out infinite; }
    .ink    { animation: ink 10s ease-in-out infinite; }
    .track  { animation: track 10s ease-in-out infinite; }
    @keyframes bg    { 0%,42%,100% { fill: #181411; } 50%,92% { fill: #1b2119; } }
    @keyframes card  { 0%,42%,100% { fill: #241f1a; } 50%,92% { fill: #242b20; } }
    @keyframes accF  { 0%,42%,100% { fill: #eb8975; } 50%,92% { fill: #86a861; } }
    @keyframes accS  { 0%,42%,100% { stroke: #eb8975; } 50%,92% { stroke: #86a861; } }
    @keyframes ink   { 0%,42%,100% { fill: #ede9e4; } 50%,92% { fill: #ebe9df; } }
    @keyframes track { 0%,42%,100% { stroke: #2e2722; } 50%,92% { stroke: #3b4733; } }
    .knob { animation: knob 10s cubic-bezier(0.65,0,0.35,1) infinite; }
    @keyframes knob { 0%,42%,100% { transform: translateX(0); } 50%,92% { transform: translateX(44px); } }
    .lc { animation: lc 10s infinite; } .lo { animation: lo 10s infinite; }
    @keyframes lc { 0%,42%,100% { opacity: 1; } 47%,95% { opacity: 0.3; } }
    @keyframes lo { 0%,42%,100% { opacity: 0.3; } 47%,95% { opacity: 1; } }
    .ring { stroke-dasharray: 503; transform-box: fill-box; transform-origin: center; transform: rotate(-90deg); animation: drain 10s linear infinite, accS 10s ease-in-out infinite; }
    @keyframes drain { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 503; } }
    .sweep { animation: sweep 10s ease-in-out infinite; }
    @keyframes sweep { 0%,40% { transform: translateX(-200px); opacity: 0; } 43% { opacity: 0.5; } 50% { transform: translateX(760px); opacity: 0; } 51%,90% { transform: translateX(-200px); opacity: 0; } 93% { opacity: 0.5; } 100% { transform: translateX(760px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs><clipPath id="win"><rect x="60" y="40" width="640" height="300" rx="16"/></clipPath></defs>
  <rect width="1200" height="380" rx="20" fill="#1c1814"/>

  <!-- App-Fenster -->
  <g clip-path="url(#win)">
    <rect class="bg" x="60" y="40" width="640" height="300" fill="#181411"/>
    <!-- Seitenleiste -->
    <rect class="card" x="60" y="40" width="64" height="300" fill="#241f1a"/>
    <g class="acc-f"><rect x="80" y="64" width="24" height="24" rx="6" fill="#eb8975"/></g>
    <g class="ink" fill-opacity="0.35"><rect x="84" y="112" width="16" height="16" rx="4"/><rect x="84" y="148" width="16" height="16" rx="4"/><rect x="84" y="184" width="16" height="16" rx="4"/></g>
    <!-- Timer-Karte -->
    <rect class="card" x="148" y="64" width="300" height="252" rx="12" fill="#241f1a"/>
    <circle class="track" cx="298" cy="170" r="80" fill="none" stroke="#2e2722" stroke-width="12"/>
    <circle class="ring" cx="298" cy="170" r="80" fill="none" stroke="#eb8975" stroke-width="12" stroke-linecap="round"/>
    <text class="ink" x="298" y="182" text-anchor="middle" font-size="36" font-weight="700" fill="#ede9e4">25:00</text>
    <rect class="acc-f" x="248" y="270" width="100" height="32" rx="16" fill="#eb8975"/>
    <text x="298" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#181411">Start</text>
    <!-- Liste -->
    <rect class="card" x="468" y="64" width="210" height="120" rx="12" fill="#241f1a"/>
    <g class="ink" fill-opacity="0.6" font-size="13"><text x="486" y="94">Mathe</text><text x="486" y="124">Modul 122</text><text x="486" y="154">Englisch</text></g>
    <g class="acc-f"><rect x="580" y="86" width="80" height="8" rx="4"/><rect x="580" y="116" width="54" height="8" rx="4" opacity="0.75"/><rect x="580" y="146" width="34" height="8" rx="4" opacity="0.5"/></g>
    <rect class="card" x="468" y="200" width="210" height="116" rx="12" fill="#241f1a"/>
    <g class="acc-f"><rect x="488" y="276" width="18" height="24" rx="3"/><rect x="512" y="256" width="18" height="44" rx="3"/><rect x="536" y="266" width="18" height="34" rx="3"/><rect x="560" y="236" width="18" height="64" rx="3"/><rect x="584" y="250" width="18" height="50" rx="3"/><rect x="608" y="242" width="18" height="58" rx="3"/><rect x="632" y="260" width="18" height="40" rx="3"/></g>
    <!-- Lichtstreifen beim Wechsel -->
    <rect class="sweep" x="60" y="40" width="120" height="300" fill="#ffffff" fill-opacity="0.12" transform="skewX(-12)"/>
  </g>
  <rect x="60" y="40" width="640" height="300" rx="16" fill="none" stroke="#ede9e4" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Rechte Seite: Schalter und Icons -->
  <text x="780" y="92" font-size="15" font-weight="600" fill="#eb8975" letter-spacing="3">DESIGN</text>
  <g>
    <text class="lc" x="780" y="152" font-size="28" font-weight="700" fill="#ede9e4">Coral</text>
    <rect x="880" y="128" width="88" height="44" rx="22" fill="#ede9e4" fill-opacity="0.08" stroke="#ede9e4" stroke-opacity="0.2"/>
    <g class="knob"><circle class="acc-f" cx="902" cy="150" r="16" fill="#eb8975"/></g>
    <text class="lo" x="988" y="152" font-size="28" font-weight="700" fill="#ede9e4">Original</text>
  </g>
  <text x="780" y="214" font-size="16" fill="#a9a29b">Farben, Felder und App-Icon wechseln mit –</text>
  <text x="780" y="238" font-size="16" fill="#a9a29b">im Browser, unter Windows und auf dem iPhone.</text>
  <!-- App-Icons -->
  <g class="lc" transform="translate(780 266)">
    <rect width="64" height="64" rx="14" fill="#181411" stroke="#ede9e4" stroke-opacity="0.15"/>
    <circle cx="32" cy="35" r="17" fill="none" stroke="#eb8975" stroke-width="4"/><line x1="32" y1="8" x2="32" y2="16" stroke="#eb8975" stroke-width="4"/>
    <path d="M32 26 V36 H38" fill="none" stroke="#ede9e4" stroke-width="3"/>
  </g>
  <g class="lo" transform="translate(860 266)">
    <rect width="64" height="64" rx="14" fill="#1b2119" stroke="#ede9e4" stroke-opacity="0.15"/>
    <circle cx="32" cy="35" r="17" fill="none" stroke="#86a861" stroke-width="4"/><line x1="32" y1="8" x2="32" y2="16" stroke="#86a861" stroke-width="4"/>
    <path d="M32 26 V36 H38" fill="none" stroke="#ebe9df" stroke-width="3"/>
  </g>
</svg>
