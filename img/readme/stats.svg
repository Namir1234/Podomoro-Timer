  <style>
    text { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .bar { fill: url(#barg); transform-box: fill-box; transform-origin: bottom; animation: grow 9s cubic-bezier(0.16,1,0.3,1) infinite; }
    @keyframes grow { 0% { transform: scaleY(0); } 14%,88% { transform: scaleY(1); } 97%,100% { transform: scaleY(0); } }
    .trend { stroke-dasharray: 700; animation: trend 9s ease-in-out infinite; }
    @keyframes trend { 0%,12% { stroke-dashoffset: 700; } 35%,88% { stroke-dashoffset: 0; } 97%,100% { stroke-dashoffset: 700; } }
    .scan { animation: scan 9s ease-in-out infinite; }
    @keyframes scan { 0%,30% { transform: translateX(0); opacity: 0; } 34% { opacity: 1; } 84% { transform: translateX(616px); opacity: 1; } 88%,100% { transform: translateX(616px); opacity: 0; } }
    .leg { opacity: 0; animation: fadein 0.6s ease-out forwards; }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .flame { transform-box: fill-box; transform-origin: bottom center; animation: flick 1.2s ease-in-out infinite alternate; }
    @keyframes flick { from { transform: scale(1,1); } to { transform: scale(0.9,1.1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .leg { opacity: 1; } }
